<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Library">
<meta name="application-name" content="My Library">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="My Library — Digital bookshelf. Create and read your books.">
<title>My Library</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--pri:#7c3aed;--pri-l:#a78bfa;--pri-d:#5b21b6;--gold:#eab308;--gold-b:#fbbf24;--gold-d:#a16207;--bg:#fdf6e3;--sf:#fff;--txt:#1e1b4b;--txt2:#4a5568;--txt3:#718096;--bdr:#e2e8f0;--r-s:8px;--r-m:14px;--r-l:20px;--r-x:28px;--r-f:9999px;--shd:0 2px 8px rgba(91,33,182,.08);--shd2:0 4px 20px rgba(91,33,182,.12);--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-overflow-scrolling:touch}
body{font-family:'Poppins',sans-serif;color:var(--txt);background:linear-gradient(135deg,rgba(124,58,237,.03) 25%,transparent 25%,transparent 75%,rgba(124,58,237,.03) 75%),linear-gradient(135deg,rgba(124,58,237,.03) 25%,transparent 25%,transparent 75%,rgba(124,58,237,.03) 75%),var(--bg);background-size:40px 40px,40px 40px;background-position:0 0,20px 20px;min-height:100vh;min-height:100dvh;overflow-x:hidden;max-width:480px;margin:0 auto}
@media(min-width:481px){body{border-left:1px solid var(--bdr);border-right:1px solid var(--bdr);box-shadow:0 0 60px rgba(91,33,182,.06)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--pri-l);border-radius:4px}
.hid{display:none!important}
/* HEADER */
.hdr{position:sticky;top:0;z-index:100;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 24px rgba(91,33,182,.2);min-height:54px}
.hdr.shelf-hdr{background:linear-gradient(135deg,#5b21b6,#7c3aed,#8b5cf6)}
.hdr.book-hdr{background:linear-gradient(135deg,#14532d,#16a34a,#059669)}
.hdr .brand{display:flex;align-items:center;gap:8px}
.hdr .brand span{font-size:22px}
.hdr .brand h1{font-size:17px;font-weight:700;color:var(--gold-b);text-shadow:0 2px 6px rgba(0,0,0,.2)}
.hdr .acts{display:flex;gap:6px}
.hbtn{width:38px;height:38px;border:none;border-radius:var(--r-f);background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.hbtn:active{transform:scale(.9);background:rgba(255,255,255,.22)}

/* BOOKSHELF */
.shelf-banner{text-align:center;padding:20px 14px 12px;line-height:2}
.shelf-banner h2{font-size:16px;color:var(--pri-d);font-weight:700}
.shelf-banner p{font-size:12px;color:var(--txt3);margin-top:4px}
.shelf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px 30px}
.book-card{background:var(--sf);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shd);cursor:pointer;transition:transform .2s,box-shadow .2s;animation:fadeUp .4s ease forwards;opacity:0;position:relative}
.book-card:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.book-cover{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:56px;position:relative;overflow:hidden}
.book-cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.book-cover .cover-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.5))}
.book-info{padding:10px 12px 14px}
.book-info .btitle{font-size:13px;font-weight:700;color:var(--txt);line-height:1.7}
.book-info .bcount{font-size:10px;color:var(--txt3);margin-top:2px}
.book-del{position:absolute;top:8px;left:8px;width:28px;height:28px;border:none;border-radius:50%;background:rgba(220,38,38,.85);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;transition:opacity .2s}
.book-card:hover .book-del,.book-card:active .book-del{opacity:1}
.add-book-card{border:2px dashed var(--pri-l);background:rgba(124,58,237,.03)}
.add-book-card .book-cover{background:none}
.add-book-card .add-icon{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(124,58,237,.35)}

/* BOOK VIEW (pages) */
.bv-content{padding:12px;padding-bottom:calc(30px + var(--safe-b))}
.bv-info{background:linear-gradient(135deg,#14532d,#16a34a);color:#fff;padding:14px 16px;border-radius:var(--r-l);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shd2)}
.bv-info .cnt{font-size:24px;font-weight:700}.bv-info .lbl{font-size:11px;opacity:.85;margin-top:2px}.bv-info .ico{font-size:30px;opacity:.25}
.page-grid{display:grid;grid-template-columns:1fr;gap:12px}
.page-card{background:var(--sf);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--shd);cursor:pointer;transition:transform .2s;animation:fadeUp .35s ease forwards;opacity:0;position:relative;user-select:none;-webkit-user-select:none}
.page-card:active{transform:scale(.97)}
.page-accent{height:5px}
.page-thumb{position:relative;padding:8px}
.page-frame{position:relative;aspect-ratio:16/9;border:2px solid var(--gold);border-radius:var(--r-s);overflow:hidden;background:linear-gradient(145deg,#fefce8,#fef3c7)}
.page-frame img{width:100%;height:100%;object-fit:contain;display:block;background:#fefce8}
.page-frame .empty-pg{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.page-frame .empty-pg .pi{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#059669);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 14px rgba(22,163,74,.35)}
.page-frame .empty-pg span{margin-top:6px;font-size:9px;color:#16a34a;font-weight:700}
.pg-edit{position:absolute;top:12px;right:12px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;backdrop-filter:blur(4px)}
.pg-edit:active{transform:scale(.9)}
.pg-info{padding:6px 10px 10px;display:flex;align-items:center;justify-content:space-between}
.pg-num{font-size:10px;color:var(--txt3)}
.pg-fav{border:none;background:none;font-size:18px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.pg-fav:active{transform:scale(1.25)}
.pg-fav .he{color:#d1d5db}.pg-fav .hf{color:#ef4444}
.read-badge{position:absolute;top:12px;left:12px;background:linear-gradient(135deg,#16a34a,#059669);color:#fff;font-size:8px;padding:2px 7px;border-radius:var(--r-f);z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.reorder-hint{text-align:center;padding:8px;font-size:11px;color:var(--gold-d);background:rgba(234,179,8,.08);border-radius:var(--r-s);margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.add-pg-card .page-frame{border-style:dashed;border-color:#9ca3af}
.add-pg-card .empty-pg .pi{background:linear-gradient(135deg,#6b7280,#4b5563)!important;box-shadow:0 4px 14px rgba(107,114,128,.3)!important}

/* Drag ghost */
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;width:70vw;max-width:380px;border-radius:var(--r-m);box-shadow:0 16px 48px rgba(0,0,0,.35);opacity:.88;transform:rotate(1deg) scale(.95)}
.page-card.dragging{opacity:.35;transform:scale(.94)}
.page-card.drag-over{transform:scale(1.03);box-shadow:0 0 0 3px var(--gold-b),var(--shd2)}

/* VIEWER */
.vw{position:fixed;inset:0;z-index:500;background:#000;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.vw.open{opacity:1;visibility:visible}
.vw-top{position:absolute;top:0;left:0;right:0;z-index:20;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);pointer-events:auto}
.vw-btn{width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:.2s}
.vw-btn:active{transform:scale(.9)}
.vw-title{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--gold-b);padding:0 8px}
.vw-body{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;z-index:1}
.vw-body img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:transform .3s cubic-bezier(.25,.46,.45,.94),opacity .25s;transform-origin:center;will-change:transform}
.vw-bot{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:14px;padding-bottom:calc(14px + var(--safe-b));background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);pointer-events:auto}
.vw-acts{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.vw-acts div[style]{direction:ltr}
.va{width:44px;height:44px;border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.va:active{transform:scale(.9)}
.va.nav{background:rgba(255,255,255,.1);color:#fff}
.va.fav{width:52px;height:52px;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.va.fav.on{background:rgba(239,68,68,.25);color:#fca5a5}
.va.edt{background:rgba(234,179,8,.25);color:var(--gold-b)}
.va.upl{background:rgba(59,130,246,.2);color:#60a5fa}
.va.shr{background:rgba(37,211,102,.2);color:#25d366}
.vw-meta{text-align:center;color:rgba(255,255,255,.5);font-size:11px}
.vw-meta .pos{color:var(--gold-b);font-weight:700}

/* EDITOR SHEET */
.ed-bk{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:.3s;backdrop-filter:blur(4px)}
.ed-bk.open{opacity:1;visibility:visible}
.ed-sh{position:fixed;bottom:0;left:0;right:0;z-index:601;background:linear-gradient(180deg,#1a1a1a,#0f0f0f);border-radius:var(--r-x) var(--r-x) 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);padding-bottom:var(--safe-b)}
.ed-sh.open{transform:translateY(0)}
.ed-handle{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin:12px auto 8px}
.ed-hdr{padding:8px 18px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
.ed-hdr h3{font-size:16px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.ed-hdr h3 i{color:var(--gold-b)}
.ed-cls{width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ed-canvas{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:260px;position:relative;overflow:hidden}
.ed-canvas canvas{display:block;max-width:calc(100% - 20px);max-height:calc(100% - 20px);width:auto;height:auto;border-radius:var(--r-m);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.crop-c{position:absolute;display:none}.crop-c.active{display:block}
.crop-box{position:absolute;border:2px solid var(--gold-b);cursor:move;touch-action:none}
.crop-box::before{content:'';position:absolute;inset:0;border:1px dashed rgba(255,255,255,.4)}
.crop-h{position:absolute;width:22px;height:22px;background:var(--gold-b);border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);touch-action:none}
.crop-h.tl{top:-11px;left:-11px;cursor:nw-resize}.crop-h.tr{top:-11px;right:-11px;cursor:ne-resize}
.crop-h.bl{bottom:-11px;left:-11px;cursor:sw-resize}.crop-h.br{bottom:-11px;right:-11px;cursor:se-resize}
.ed-tools{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.trow{display:flex;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border:none;border-radius:var(--r-m);background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer;min-width:62px;transition:.2s}
.tbtn span{font-size:10px;font-weight:700}
.tbtn:active{transform:scale(.95);background:rgba(255,255,255,.15)}
.tbtn.active{background:#16a34a}
.tbtn.crop-apply{background:linear-gradient(135deg,var(--gold-d),var(--gold));display:none}
.tbtn.crop-apply.show{display:flex}
.arow{display:flex;justify-content:center;gap:10px}
.ed-cancel{padding:12px 24px;border:none;border-radius:var(--r-f);background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.ed-save{padding:12px 32px;border:none;border-radius:var(--r-f);background:linear-gradient(135deg,#14532d,#16a34a);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(22,163,74,.3)}

/* MODALS & TOAST */
.modal-bk{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.25s;backdrop-filter:blur(4px)}
.modal-bk.open{opacity:1;visibility:visible}
.modal{position:fixed;bottom:0;left:0;right:0;z-index:401;background:var(--sf);border-radius:var(--r-x) var(--r-x) 0 0;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);padding-bottom:var(--safe-b)}
.modal.open{transform:translateY(0)}
.m-handle{width:36px;height:4px;background:var(--bdr);border-radius:4px;margin:10px auto}
.m-hdr{padding:6px 16px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.m-hdr h2{font-size:17px;font-weight:700}
.m-cls{width:34px;height:34px;border:none;border-radius:50%;background:var(--bg);color:var(--txt3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.m-sec{padding:16px;border-bottom:1px solid var(--bdr)}.m-sec:last-child{border-bottom:none}
.m-sec h3{font-size:13px;font-weight:700;color:var(--pri-d);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.m-input{width:100%;padding:12px 14px;border:2px solid var(--bdr);border-radius:var(--r-s);font-family:'Poppins',sans-serif;font-size:14px;outline:none;direction:ltr;transition:border-color .2s}
.m-input:focus{border-color:var(--pri-l);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
body.ur .m-input{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}
.m-field-label{display:block;font-size:11px;color:var(--txt3);margin-bottom:6px}
.m-colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.m-clr{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.2s}
.m-clr.sel{border-color:var(--txt);transform:scale(1.15)}
.btn-p{padding:10px 20px;background:linear-gradient(135deg,var(--pri-d),var(--pri));color:#fff;border:none;border-radius:var(--r-f);font-family:'Noto Nastaliq Urdu',serif;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-p:active{transform:scale(.97)}
.btn-d{padding:10px 20px;background:#dc2626;color:#fff;border:none;border-radius:var(--r-f);font-size:13px;cursor:pointer}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.about{text-align:center}.about .nm{font-size:22px;font-weight:700;color:var(--pri)}.about .vr{font-size:11px;color:var(--txt3);margin:2px 0 10px}.about .cr{font-size:12px;color:var(--txt2);background:var(--bg);padding:10px 14px;border-radius:var(--r-m)}

.toast-w{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;width:90%;max-width:320px;pointer-events:none}
.toast{background:var(--pri-d);color:#fff;padding:10px 22px;border-radius:var(--r-f);font-size:13px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:ti .3s ease,to .3s ease 2s forwards}
@keyframes ti{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes to{to{opacity:0;transform:translateY(16px)}}
.empty-s{text-align:center;padding:50px 16px}.empty-s .ei{font-size:50px;margin-bottom:12px}.empty-s .et{font-size:15px;font-weight:700;margin-bottom:6px}.empty-s .eh{font-size:12px;color:var(--txt3);line-height:1.8}
.hidden-input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}

/* PDF READER */
.pdf-reader{position:fixed;inset:0;z-index:500;background:#2d2d2d;display:none;flex-direction:column}
.pdf-reader.open{display:flex}
.pdf-top{position:sticky;top:0;z-index:10;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);min-height:50px}
.pdf-top .pdf-title{flex:1;text-align:center;font-size:13px;font-weight:600;color:#fff;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;padding:8px}
.pdf-pages canvas{display:block;width:100%;margin:0 auto 8px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pdf-bottom{padding:8px 14px;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);text-align:center;font-size:11px;color:rgba(255,255,255,.5)}
.pdf-upload-area{display:flex;align-items:center;gap:8px;margin-top:8px}
.pdf-upload-area button{flex:1;padding:12px;border:2px dashed var(--pri-l);border-radius:var(--r-m);background:rgba(124,58,237,.05);color:var(--pri);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.pdf-upload-area button:active{transform:scale(.98);background:rgba(124,58,237,.1)}
body.ur{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}
body.ur .m-input{direction:rtl}
body.ur .btn-p,body.ur .btn-d,body.ur .ed-cancel,body.ur .ed-save{font-family:'Noto Nastaliq Urdu',serif}
.lang-toggle{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);border-radius:var(--r-f);padding:3px;height:32px}
.lang-toggle button{border:none;padding:4px 10px;border-radius:var(--r-f);font-size:11px;font-weight:700;cursor:pointer;transition:.2s;background:transparent;color:rgba(255,255,255,.6);font-family:'Poppins',sans-serif}
.lang-toggle button.active{background:#fff;color:var(--pri-d);box-shadow:0 1px 4px rgba(0,0,0,.15)}
</style>
</head>
<body>
<input type="file" class="hidden-input" id="importInput" accept=".json">

<!-- ===== BOOKSHELF VIEW ===== -->
<div id="shelfView">
  <header class="hdr shelf-hdr">
    <div class="brand"><span>📚</span><h1 id="shelfTitle"></h1></div>
    <div class="acts">
      <div class="lang-toggle" id="langToggle"><button id="langEn" class="active">EN</button><button id="langUr">اردو</button></div>
      <button class="hbtn" id="shelfSettingsBtn"><i class="fas fa-cog"></i></button>
    </div>
  </header>
  <div class="shelf-banner"><h2 id="bannerTitle"></h2><p id="bannerSub"></p></div>
  <div class="shelf-grid" id="shelfGrid"></div>
</div>

<!-- ===== BOOK VIEW ===== -->
<div id="bookView" class="hid">
  <header class="hdr book-hdr">

// ===== DATA LAYER =====
function getLibrary(){var lib=ls('ml_library');if(!lib){lib={books:[{id:'darood_default',name:'گلدستۂ درود',emoji:'🕌',color:'#16a34a',pageCount:33,order:null,favs:[],reads:{},images:{},created:Date.now()}],activeBook:null};ls('ml_library',lib)}return lib}
function saveLib(lib){ls('ml_library',lib)}
function getBook(id){var lib=getLibrary();for(var i=0;i<lib.books.length;i++){if(lib.books[i].id===id)return lib.books[i]}return null}
function saveBook(book){var lib=getLibrary();for(var i=0;i<lib.books.length;i++){if(lib.books[i].id===book.id){lib.books[i]=book;break}}saveLib(lib)}
function getPageImg(book,pgId){if(book.images[pgId])return book.images[pgId];if(book.id==='darood_default'&&DAROOD_IMGS[pgId])return DAROOD_IMGS[pgId];return null}
function getOrder(book){if(!book.order||book.order.length!==book.pageCount){book.order=[];for(var i=1;i<=book.pageCount;i++)book.order.push(i)}return book.order}
function getPages(book){var order=getOrder(book);var list=[];for(var i=0;i<order.length;i++){var id=order[i];list.push({id:id,num:id,color:COLORS[(id-1)%COLORS.length]})}return list}

// ===== CURRENT STATE =====
var curBookId=null;var curSearch='';

// ===== BOOKSHELF RENDER =====
function renderShelf(){var lib=getLibrary();var grid=document.getElementById('shelfGrid');grid.innerHTML='';
lib.books.forEach(function(bk,i){var card=document.createElement('div');card.className='book-card';card.style.animationDelay=(i*60)+'ms';
var coverImg=bk.images&&bk.images[1]?bk.images[1]:(bk.id==='darood_default'&&DAROOD_IMGS[1]?DAROOD_IMGS[1]:null);
var coverHTML=coverImg?'<img src="'+coverImg+'" alt=""><div class="cover-grad"></div>':'';
card.innerHTML='<div class="book-cover" style="background:'+bk.color+'">'+(coverImg?coverHTML:'<span style="filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))">'+bk.emoji+'</span>')+'</div><div class="book-info"><div class="btitle">'+bk.name+'</div><div class="bcount">'+bk.pageCount+' '+t('pages')+'</div></div>'+(bk.id!=='darood_default'?'<button class="book-del" data-bid="'+bk.id+'"><i class="fas fa-trash"></i></button>':'');
card.addEventListener('click',function(e){if(e.target.closest('.book-del'))return;openBook(bk.id)});
var del=card.querySelector('.book-del');if(del)del.addEventListener('click',function(e){e.stopPropagation();if(confirm(t('deleteBookQ')+bk.name+t('deleteBookQ2'))){var lib=getLibrary();lib.books=lib.books.filter(function(b){return b.id!==bk.id});saveLib(lib);toast(t('bookDeleted'));renderShelf()}});
grid.appendChild(card)});
var add=document.createElement('div');add.className='book-card add-book-card';add.style.animationDelay=(lib.books.length*60)+'ms';
add.innerHTML='<div class="book-cover"><div class="add-icon"><i class="fas fa-plus"></i></div></div><div class="book-info"><div class="btitle">'+t('newBook')+'</div><div class="bcount">'+t('addBook')+'</div></div>';
add.addEventListener('click',openCreateModal);grid.appendChild(add)}

// ===== OPEN/CLOSE BOOK =====
function openBook(id){curBookId=id;curSearch='';document.getElementById('shelfView').classList.add('hid');document.getElementById('bookView').classList.remove('hid');var bk=getBook(id);document.getElementById('bookTitle').textContent=bk.name;renderBook()}
function closeBook(){curBookId=null;document.getElementById('bookView').classList.add('hid');document.getElementById('shelfView').classList.remove('hid');renderShelf()}
document.getElementById('backToShelf').addEventListener('click',closeBook);

// ===== RENDER BOOK PAGES =====
function renderBook(){var bk=getBook(curBookId);if(!bk)return;var cont=document.getElementById('bookContent');cont.innerHTML='';
var infoHTML='<div class="bv-info"><div><div class="cnt">'+bk.pageCount+'</div><div class="lbl">'+t('pages')+'</div></div><div class="ico">'+bk.emoji+'</div></div>';
if(bk.pageCount>0){infoHTML+='<button class="btn-p" style="width:100%;justify-content:center;padding:14px;margin-bottom:12px;font-size:14px;border-radius:var(--r-m);background:linear-gradient(135deg,#7c3aed,#a78bfa)" id="readBookBtn"><i class="fas fa-book-open"></i> '+t('openPdf')+'</button>'}
cont.innerHTML=infoHTML;
var readBtn=document.getElementById('readBookBtn');
if(readBtn){readBtn.addEventListener('click',function(){openPdfReader(curBookId)})}
if(bk.pageCount>1){var hint=document.createElement('div');hint.className='reorder-hint';hint.innerHTML='<i class="fas fa-arrows-up-down"></i> '+t('reorderHint');cont.appendChild(hint)}
var grid=document.createElement('div');grid.className='page-grid';grid.id='pageGrid';
var pages=getPages(bk);var filtered=pages;
if(curSearch){filtered=pages.filter(function(p){return String(p.num).includes(curSearch)})}
filtered.forEach(function(pg,i){var card=buildPageCard(bk,pg,i);attachPageDrag(card,bk,pg.id);grid.appendChild(card)});
// Add page card
if(!curSearch){
  // Add page card
  var ac=document.createElement('div');ac.className='page-card add-pg-card';ac.style.animationDelay=(filtered.length*30)+'ms';ac.innerHTML='<div class="page-accent" style="background:#9ca3af"></div><div class="page-thumb"><div class="page-frame"><div class="empty-pg"><div class="pi"><i class="fas fa-plus"></i></div><span>'+t('addPage')+'</span></div></div></div><div class="pg-info"><span class="pg-num">➕ '+t('addMore')+'</span></div>';
  ac.addEventListener('click',function(){bk.pageCount++;getOrder(bk).push(bk.pageCount);saveBook(bk);renderBook();toast(t('newPageAdded'));setTimeout(function(){window.scrollTo(0,document.body.scrollHeight)},100)});grid.appendChild(ac);
  // Add PDF upload card
  var pc=document.createElement('div');pc.className='page-card add-pg-card';pc.style.animationDelay=((filtered.length+1)*30)+'ms';pc.innerHTML='<div class="page-accent" style="background:#dc2626"></div><div class="page-thumb"><div class="page-frame"><div class="empty-pg"><div class="pi" style="background:linear-gradient(135deg,#dc2626,#ef4444)!important;box-shadow:0 4px 14px rgba(220,38,38,.35)!important"><i class="fas fa-file-pdf"></i></div><span style="color:#dc2626">'+t('pdfBtnLabel')+'</span></div></div></div><div class="pg-info"><span class="pg-num">📄 PDF</span></div>';
  pc.addEventListener('click',function(){triggerPdfUploadForBook(bk.id)});grid.appendChild(pc);
}
cont.appendChild(grid)}

function buildPageCard(bk,pg,i){var card=document.createElement('div');card.className='page-card';card.style.animationDelay=(i*30)+'ms';card.dataset.pgId=pg.id;
var img=getPageImg(bk,pg.id);var rc=bk.reads[pg.id]||0;var fav=bk.favs&&bk.favs.indexOf(pg.id)!==-1;

function cdMove(e){e.preventDefault();var pt=e.touches?e.touches[0]:e,dx=pt.clientX-cds.x,dy=pt.clientY-cds.y,r=cds.r,cw=parseFloat(cropC.style.width),ch=parseFloat(cropC.style.height);

// PDF Upload button
document.getElementById('pdfUploadBtn').addEventListener('click',function(){
  var fi=document.createElement('input');fi.type='file';fi.accept='application/pdf';
  fi.onchange=function(e){
    var file=e.target.files&&e.target.files[0];
    if(!file)return;
    document.getElementById('pdfStatus').textContent=t('pdfLoading');
    var reader=new FileReader();
    reader.onload=function(ev){
      convertPdfToImages(new Uint8Array(ev.target.result),function(pages){
        pendingPdfPages=pages;
        document.getElementById('pdfStatus').textContent='✅ '+pages.length+t('pdfDone');
        if(!document.getElementById('newBookName').value.trim()){
          var fname=file.name.replace(/\.pdf$/i,'');
          document.getElementById('newBookName').value=fname;
        }
      });
    };
    reader.readAsArrayBuffer(file);
  };
  fi.click();
});

function convertPdfToImages(data,callback){
  if(!window.pdfjsLib){toast('PDF.js not loaded');return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument({data:data}).promise.then(function(pdf){
    var pages=[];var total=pdf.numPages;var done=0;
    function renderPage(num){
      pdf.getPage(num).then(function(page){
        var scale=2;var vp=page.getViewport({scale:scale});
        var c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
        var ctx=c.getContext('2d');
        page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
          pages[num-1]=c.toDataURL('image/jpeg',0.92);
          done++;
          document.getElementById('pdfStatus').textContent=t('pdfLoading')+' ('+done+'/'+total+')';
          if(done===total)callback(pages);
          else renderPage(num+1);
        });
      });
    }
    renderPage(1);
  }).catch(function(){toast(t('fileBad'))});
}

// ===== PDF READER =====
function openPdfReader(bookId){
  var bk=getBook(bookId);if(!bk||bk.pageCount===0)return;
  var reader=document.getElementById('pdfReader');
  var container=document.getElementById('pdfPagesContainer');
  document.getElementById('pdfReaderTitle').textContent=bk.name;
  container.innerHTML='';
  var pages=getPages(bk);
  pages.forEach(function(pg,i){
    var img=getPageImg(bk,pg.id);
    if(img){
      var imgEl=document.createElement('img');
      imgEl.src=img;imgEl.alt=t('pdfPage')+' '+(i+1);
      imgEl.style.cssText='display:block;width:100%;margin:0 auto 8px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.4)';
      container.appendChild(imgEl);
    }
  });
  var info=document.getElementById('pdfPageInfo');
  info.textContent=bk.name+' — '+pages.length+' '+t('pages');
  reader.classList.add('open');
  document.body.style.overflow='hidden';
  // Track read
  pages.forEach(function(pg){bk.reads[pg.id]=(bk.reads[pg.id]||0)+1});
  saveBook(bk);
}
document.getElementById('pdfClose').addEventListener('click',function(){
  document.getElementById('pdfReader').classList.remove('open');
  document.body.style.overflow='';
  if(curBookId)renderBook();
});
document.getElementById('pdfShare').addEventListener('click',function(){
  var title=document.getElementById('pdfReaderTitle').textContent;
  window.open('https://wa.me/?text='+encodeURIComponent('📖 '+title+'\n\n📚 '+t('appName')),'_blank');
});

// Also add PDF upload to existing books
function triggerPdfUploadForBook(bookId){
  var fi=document.createElement('input');fi.type='file';fi.accept='application/pdf';
  fi.onchange=function(e){
    var file=e.target.files&&e.target.files[0];
    if(!file)return;
    toast(t('pdfLoading'));
    var reader=new FileReader();
    reader.onload=function(ev){
      convertPdfToImages(new Uint8Array(ev.target.result),function(pages){
        var bk=getBook(bookId);
        for(var i=0;i<pages.length;i++){
          bk.pageCount++;
          getOrder(bk).push(bk.pageCount);
          bk.images[bk.pageCount]=pages[i];
        }
        saveBook(bk);
        toast('✅ '+pages.length+t('pdfDone'));
        renderBook();renderShelf();
      });
    };
    reader.readAsArrayBuffer(file);
  };
  fi.click();
}

// ===== SETTINGS =====
document.getElementById('shelfSettingsBtn').addEventListener('click',function(){document.getElementById('settBk').classList.add('open');document.getElementById('settModal').classList.add('open');document.body.style.overflow='hidden'});
document.getElementById('bookSettingsBtn').addEventListener('click',function(){document.getElementById('settBk').classList.add('open');document.getElementById('settModal').classList.add('open');document.body.style.overflow='hidden'});
function closeSett(){document.getElementById('settBk').classList.remove('open');document.getElementById('settModal').classList.remove('open');document.body.style.overflow=''}
document.getElementById('settClose').addEventListener('click',closeSett);
document.getElementById('settBk').addEventListener('click',closeSett);
document.getElementById('expBtn').addEventListener('click',function(){var data=getLibrary();var blob=new Blob([JSON.stringify(data)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='meri-library-backup.json';a.click();URL.revokeObjectURL(url);toast(t('exported'))});
document.getElementById('impBtn').addEventListener('click',function(){document.getElementById('importInput').click()});
document.getElementById('importInput').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(d.books){ls('ml_library',d);toast(t('imported'));renderShelf()}else{toast(t('fileBad'))}}catch(err){toast(t('fileBad'))}};r.readAsText(f);e.target.value=''});
document.getElementById('clearBtn').addEventListener('click',function(){if(confirm(t('clearQ'))){localStorage.removeItem('ml_library');toast(t('cleared'));closeSett();renderShelf()}});

// ===== PWA =====
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}

// ===== INIT =====
setLang(curLang);
renderShelf();
</script>
